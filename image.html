<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像の表示</title>
</head>

<body>
    <h1>画像の表示</h1>
    <h2>そのままの大きさ</h2>
    <p><img src="images/main_photo.jpg" alt=""></p>
    <p><img src="images/item_photo02.jpg" alt="ピザ"></p>
    <h2>300ピクセルに幅を指定</h2>
    <p><img src="images/item_photo03.jpg" width="300" hspace="10" alt="ステーキ">
        <img src="images/shop.jpg" width="300" hspace="10" alt="お店">
    </p>
    <p>widthは画像の幅を、hspaceは画像の左右の余白を表す</p>
</body>

</html>
